name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Concurrency is scoped PER JOB (not workflow-wide) on purpose.
# A workflow-level `cancel-in-progress: true` would also abort the `deploy`
# job when a new commit lands mid-deploy, leaving prod half-updated (git
# reset done, but migrate/collectstatic/restart not). So lint/test/docker
# stay cancellable (only the latest commit matters, saves runners), while
# `deploy` uses its own group with cancel-in-progress:false (see below).

env:
  PYTHON_VERSION: "3.13"
  DJANGO_SETTINGS_MODULE: enb_django.settings
  DJANGO_DEBUG: "1"
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_NAME: test_enb
  DB_USER: postgres
  DB_PASSWORD: postgres

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Cancellable: a newer push supersedes lint of the older commit.
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Blocking gate: every F* (unused imports/vars, f-strings, undefined
      # names), E4 (import hygiene), E7 (statement smells), E9 (syntax),
      # W391/W6. Codebase was brought to zero on this set in 2026-07 —
      # regressions fail the build. Only pure formatting (E1/E2/E3/E501)
      # and complexity (C901) remain advisory below.
      - name: Flake8 (blocking)
        run: |
          flake8 . --count --show-source --statistics --extend-ignore=E1,E2,E3,E501,C901

      # Complexity gate for packages brought to zero C901 in 2026-08
      # (safety-net tests + decompose campaign): ALL of legacy (except the
      # one-off import_legacy_dump), my_fields, agrocosmos/views and
      # agrocosmos/services and the small core packages. agrocosmos
      # commands are NOT yet clean — extend the path list as they get
      # refactored, never shrink it.
      - name: Flake8 complexity gate (C901-clean packages)
        run: |
          flake8 legacy my_fields agrocosmos/views agrocosmos/services users core enb_django --select=C901 --max-complexity=10 --count --show-source --extend-exclude=legacy/management/commands/import_legacy_dump.py

      - name: Flake8 (advisory formatting report)
        run: |
          flake8 . --count --statistics --exit-zero

  test:
    name: Test
    runs-on: ubuntu-latest
    # Cancellable: a newer push supersedes the test run of the older commit.
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    # The job runs in ~2 min after the 2026-07 CI cleanup (apt/pip caches,
    # --parallel auto, dropped duplicate migrate step). 10 min is a real
    # watchdog again — a regression back to the old 20-min behaviour should
    # fail loudly, not silently burn runner minutes.
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_enb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # GDAL/GEOS via cache-apt-pkgs-action. The recurring CI failure used to be
      # `apt-get` HANGING on a Debian/Ubuntu mirror, which wedged the whole job
      # up to the timeout cap. This action caches the installed .deb file trees:
      #   - cache HIT  → restores files directly (no apt, no mirror network) in
      #     a few seconds, so a flaky mirror can no longer block the job.
      #   - cache MISS → installs once, then saves the cache for later runs.
      # execute_install_scripts runs the dpkg post-install hooks (notably
      # ldconfig) so the dynamic linker resolves libgdal/libgeos by soname at
      # runtime. Bump `version` to force-invalidate the cache (e.g. GDAL ABI
      # change). Pinned to @latest per the action's docs; can be tightened to a
      # commit SHA if stricter supply-chain pinning is wanted.
      - name: Install system dependencies (GDAL/GEOS, cached)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: gdal-bin libgdal-dev libgeos-dev
          version: gdal-1
          execute_install_scripts: true

      - name: Verify GDAL toolchain
        run: gdal-config --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # NOTE: no standalone `migrate` step. It used to run a FULL ~47-migration
      # replay against the service DB — redundant with the one `create_test_db`
      # already performs when building the test DB in the "Run tests" step
      # below (which fails loudly if any migration is broken). Dropping it cuts
      # the slowest part of the job roughly in half for zero loss of safety.

      # Drift gate: fail the build if a model was changed without generating its
      # migration. The repo's accumulated drift was cleaned up (agrocosmos
      # 0033/0034, my_fields 0004), so this is now green and guards against
      # re-accumulation. No DB access needed — just compares models vs files.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # Deploy check is a real gate (no `|| true`): any security.W* warning
      # fails the build. Runs with a prod-like env (DEBUG=0, SSL, HSTS, long
      # SECRET_KEY) — the workflow-level env is dev-like, which would disable
      # half of the --deploy checks and trigger the rest spuriously.
      - name: Django deploy check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-deploy-check-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
          SECURE_SSL_REDIRECT: "1"
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level WARNING

      # --parallel auto: split tests across all runner CPUs. Django clones the
      # test DB per worker via `CREATE DATABASE ... TEMPLATE` (cheap — does NOT
      # re-run migrations), so wall-clock test time drops roughly Nx. Needs
      # tblib (in requirements.txt) to ship tracebacks back from workers.
      # `time` + `--durations 20` are diagnostics for the ~20-min job (see
      # docs/TODO_infra.md): the gap between step start and the first test
      # line is setup_databases (migrations), `--durations` prints the 20
      # slowest tests (Python 3.12+ / Django 5.0+ feature, works with
      # --parallel). Together they show where the minutes actually go.
      - name: Run tests
        run: time python manage.py test legacy agrocosmos my_fields --parallel auto --verbosity=2 --durations 20

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Cancellable: only the latest commit's image matters.
    concurrency:
      group: ci-docker-${{ github.ref }}
      cancel-in-progress: true
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t enb-django:${{ github.sha }} .

  deploy:
    name: Deploy to app server
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    # NOT cancellable. A deploy mutates the live server (git reset --hard,
    # build, migrate, collectstatic, restart). Cancelling mid-flight would
    # leave prod half-updated. cancel-in-progress:false serialises deploys:
    # a deploy from a newer push QUEUES behind the running one instead of
    # killing it.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH to VM1 (app)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/edunabazar
            # `git fetch` over HTTPS occasionally dies with a transient
            # "GnuTLS recv error (-54)" — a dropped TLS read on the server
            # (flaky network / old GnuTLS + HTTP/2). Pin HTTP/1.1 + a bigger
            # buffer and retry with backoff so one dropped read no longer
            # aborts the whole deploy.
            git config http.version HTTP/1.1
            git config http.postBuffer 524288000
            for attempt in 1 2 3 4 5; do
              if git fetch origin; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::git fetch failed after 5 attempts"; exit 1
              fi
              echo "git fetch failed (attempt $attempt) — retrying in $((attempt*5))s"
              sleep $((attempt * 5))
            done
            git reset --hard origin/main
            # Build both web and worker — they share the Dockerfile but
            # docker compose maintains them as separate image tags.
            docker compose -f docker-compose.prod.yml build web worker
            # Migrate/collectstatic run in a ONE-OFF container from the NEW
            # image BEFORE the running containers are swapped. The old order
            # (up -d, then migrate) had a window where new code served
            # requests against the old schema; now a failed migration aborts
            # the deploy while the old containers keep serving untouched.
            # --no-deps: don't touch the already-running redis.
            docker compose -f docker-compose.prod.yml run --rm --no-deps web python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml run --rm --no-deps web python manage.py collectstatic --noinput
            docker compose -f docker-compose.prod.yml up -d
            # Post-deploy smoke gate: wait until the new web container's own
            # healthcheck (GET /healthz inside the container) reports healthy.
            # Without this a deploy that starts a crash-looping web would end
            # "green" and the outage would be discovered by users. ~150 s cap
            # covers the 15 s start_period + several 30 s check intervals.
            web_cid=$(docker compose -f docker-compose.prod.yml ps -q web)
            status=unknown
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$web_cid" || echo unknown)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "::error::web container is '$status' after deploy — aborting"
              docker compose -f docker-compose.prod.yml logs --tail 100 web
              exit 1
            fi
            # Mark stale running PipelineRuns as failed (e.g. killed by prior worker timeout)
            docker compose -f docker-compose.prod.yml exec -T web python manage.py cleanup_stale_runs --timeout-min 10 || true
            # Make sure every Region has an active MODIS monitoring task for
            # the current year. Idempotent — only creates missing tasks and
            # reactivates paused ones; never overwrites state otherwise.
            docker compose -f docker-compose.prod.yml exec -T web python manage.py ensure_all_regions_monitored || true
            # Pre-warm the Agrocosmos GeoJSON choropleth cache so the first
            # post-deploy user does not pay the ~20 s rebuild cost (which on
            # bursts of traffic was enough to lock all gunicorn workers).
            docker compose -f docker-compose.prod.yml exec -T web python manage.py prewarm_agro_caches || true
            docker image prune -f
            # Install/update cron jobs (idempotent: replaces marker-bounded
            # block in user crontab and scrubs legacy duplicates).
            bash /opt/edunabazar/deploy/install_cron.sh
