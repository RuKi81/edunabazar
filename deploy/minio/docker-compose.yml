# VM2: Object storage (MinIO, S3-compatible) — 10.0.0.11, internal.
# Хранит геокодированные растры (оригиналы + Cloud-Optimized GeoTIFF).
#
# Deploy: скопировать этот файл + .env в /opt/edunabazar-minio/ на VM2 и:
#   docker compose up -d
#
# Порт 9000 (S3 API) файрволить так же, как 5432 Postgres — только с VM1
# (195.47.196.46). Порт 9001 (web-консоль) — только по SSH-туннелю, наружу
# НЕ открывать. Публичный доступ браузера идёт через nginx на VM1
# (поддомен s3.edunabazar.ru → 10.0.0.11:9000), см. deploy/minio/README.md.

services:
  minio:
    # Суффикс -cpuv1: образ собран на старом glibc и работает на CPU без
    # x86-64-v2. У VM2 тип CPU Proxmox (qemu64/kvm64) НЕ отдаёт x86-64-v2,
    # обычный тег падает с "Fatal glibc error: CPU does not support x86-64-v2"
    # (exit 127). Не переходить на тег без -cpuv1, пока CPU VM2 не сменён на
    # host/x86-64-v2. См. https://github.com/minio/minio/issues/18365.
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z-cpuv1
    restart: always
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      # Публичный адрес S3-эндпоинта (через nginx VM1). Используется для
      # корректных redirect/URL в ответах и подписей presigned-запросов.
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-https://s3.edunabazar.ru}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://s3.edunabazar.ru/minio-console/}
      # CORS: браузер грузит части multipart напрямую с origin портала.
      # Без этого PUT частей блокируется и ETag не доходит до финализации.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-https://edunabazar.ru,https://www.edunabazar.ru}
      # Алиас для healthcheck (`mc ready local`) без ручной настройки alias
      # внутри контейнера. Хост localhost:9000 внутри контейнера всегда доступен.
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9000
    command: server /data --console-address ":9001"
    ports:
      # S3 API привязан к ВНУТРЕННЕМУ интерфейсу VM2 (10.0.0.11), НЕ к 0.0.0.0:
      # у VM2 есть публичный IP (93.95.98.209), а docker публикует порты в
      # обход UFW (правила в цепочке DOCKER идут раньше INPUT). Привязка к
      # 10.0.0.11 гарантирует, что S3 доступен только из внутренней сети
      # (VM1 → 10.0.0.11:9000), а не из интернета. См. deploy/minio/README.md.
      - "10.0.0.11:9000:9000"
      # Web-консоль — слушаем на localhost VM2, доступ по SSH-туннелю.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  minio_data:
