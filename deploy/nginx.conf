# MVT tile cache: 200MB, inactive 60min, keys in shared zone
proxy_cache_path /tmp/nginx_tile_cache levels=1:2 keys_zone=tiles:10m max_size=200m inactive=60m;

# NB: we intentionally do NOT use an `upstream { server web:8000; }` block.
# Nginx OSS resolves upstream hostnames once at startup and caches the IP
# forever, which breaks after `docker compose up -d --build web` because
# the web container comes up with a new IP. Instead we use Docker's
# embedded resolver (127.0.0.11) and put `web:8000` into a `set` variable
# so nginx re-resolves it per-request (with `valid=10s` TTL).

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2
    font/woff
    font/ttf;

# HTTP — redirect to HTTPS + Let's Encrypt challenge
server {
    listen 80;
    server_name edunabazar.ru www.edunabazar.ru errors.edunabazar.ru 195.47.196.46;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name edunabazar.ru www.edunabazar.ru;

    ssl_certificate /etc/letsencrypt/live/edunabazar.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edunabazar.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Re-resolve `web` via Docker's embedded DNS so nginx survives
    # web container rebuilds without a manual restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_upstream web:8000;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files (uploaded photos etc.)
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # MVT tiles — Nginx proxy cache (fast, avoids hitting Django/PostGIS)
    location /agrocosmos/api/tiles/ {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        proxy_cache tiles;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 204 1m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Agrocosmos API — other endpoints
    location /agrocosmos/api/ {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # ГИС-загрузка SHP (ZIP) — админский эндпоинт /me/gis/api/layers/.
    # Архивы шейп-файлов бывают очень большими (десятки/сотни МБ, .dbf
    # распакованный — сотни МБ), поэтому здесь снимаем лимит на размер тела
    # и стримим его прямо в Django (без буферизации всего архива в nginx).
    # Таймауты подняты, т.к. импорт крупного слоя в PostGIS идёт долго.
    # NB: gunicorn запущен с --timeout 90 (см. Dockerfile) — очень крупные
    # слои всё равно могут упереться в него; для них нужен асинхронный импорт.
    location /me/gis/api/layers/ {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        client_max_body_size 0;          # без лимита на размер загрузки
        proxy_request_buffering off;     # стримим тело в Django, не копим в nginx
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Proxy to Django/Gunicorn
    location / {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20M;
    }
}

# MinIO S3 API — s3.edunabazar.ru → MinIO на VM2 (10.0.0.11:9000).
# Прямая (presigned) загрузка растров из браузера идёт СЮДА, минуя
# gunicorn: браузер льёт части S3 Multipart Upload прямо в MinIO.
#
# ВАЖНО для SigV4: путь и Host НЕ переписываются. boto3 подписывает
# presigned URL на https://s3.edunabazar.ru/<bucket>/<key>?X-Amz-...,
# nginx проксирует запрос как есть (path-style), поэтому MinIO пересчитывает
# подпись по тем же Host+path+query и она сходится. НЕ добавлять trailing
# slash в proxy_pass и НЕ трогать $request_uri.
server {
    listen 443 ssl http2;
    server_name s3.edunabazar.ru;

    ssl_certificate /etc/letsencrypt/live/edunabazar.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edunabazar.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # MinIO живёт на VM2; статический IP, docker-DNS тут не нужен.
    location / {
        proxy_pass http://10.0.0.11:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        # Части multipart крупные (десятки/сотни МБ) — стримим, не буферизуем.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding off;
    }
}

# GlitchTip (self-hosted error tracker) — errors.edunabazar.ru.
# Uses the SAME certificate as the main site: issue/renew it with
# `--expand -d errors.edunabazar.ru` (see deploy/glitchtip/README.md).
# Until the cert covers the subdomain, browsers show a cert warning for
# errors.*, but nginx itself starts fine (the cert files exist), so
# shipping this config ahead of the cert cannot take the main site down.
# glitchtip-web lives in a separate compose project joined to this
# network — re-resolve per-request like the django upstream above.
server {
    listen 443 ssl http2;
    server_name errors.edunabazar.ru;

    ssl_certificate /etc/letsencrypt/live/edunabazar.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edunabazar.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $glitchtip_upstream glitchtip-web:8000;

    location / {
        proxy_pass http://$glitchtip_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        # sentry-sdk envelope payloads are small, but crash bursts send
        # many; keep limits modest and independent from the main site.
        client_max_body_size 20M;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
